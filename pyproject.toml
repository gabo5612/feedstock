[project]
name = "crucible"
version = "0.1.0"
description = "Plataforma local-first de riesgo de costo de insumos metalicos"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]", "fastapi", "uvicorn[standard]"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crucible"]
